  function findLeafletMapDiv() {
    for (const k in window) {
      if (k.startsWith('map_')) {
        const el = document.getElementById(k);
        if (el) return el;
      }
    }
    const fm = document.querySelector('.folium-map');
    return fm || null;
  }

  function adjustMapWidth() {
    const mapDiv = findLeafletMapDiv();
    if (!mapDiv) return;
    const leftOpen = document.getElementById('sidebar').classList.contains('open');
    const rightOpen = document.getElementById('infobar').classList.contains('open');
    let left = leftOpen ? 320 : 0;
    let right = rightOpen ? 340 : 0;
    mapDiv.style.marginLeft = left + 'px';
    mapDiv.style.marginRight = right + 'px';
    mapDiv.style.width = 'calc(100% - ' + (left + right) + 'px)';
  }

  function zoomTo(lat, lng, label) {
    let leafletMap = null;
    for (const k in window) {
      if (k.startsWith('map_') && window[k] && window[k].setView) { leafletMap = window[k]; break; }
    }
    if (!leafletMap) return;
    leafletMap.setView([lat, lng], 14);
    L.popup().setLatLng([lat, lng]).setContent(label).openOn(leafletMap);
  }

  function buildSidebar() {
    const daysEl = document.getElementById('days');
    for (const day of Object.keys(schedule)) {
      const d = document.createElement('details');
      d.open = true;
      const s = document.createElement('summary');
      s.innerHTML = `<span class="day-title">${day}</span>`;
      d.appendChild(s);
      for (const it of schedule[day]) {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `<span class="time">${it.time}</span> ${it.name}`;
        item.onclick = () => zoomTo(it.coord[0], it.coord[1], `${day} ${it.time} ${it.name}`);
        d.appendChild(item);
      }
      daysEl.appendChild(d);
    }
  }

  function buildInfobar() {
    const mealsEl = document.getElementById('meals');
    for (const day of Object.keys(meals)) {
      const div = document.createElement('div');
      div.className = 'meal-day';
      const l = meals[day].lunch || '-';
      const d = meals[day].dinner || '-';
      div.innerHTML = `<div class="label">${day}</div>
        <div>午餐：${l}</div>
        <div>晚餐：${d}</div>`;
      mealsEl.appendChild(div);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    buildSidebar();
    buildInfobar();
    adjustMapWidth();

    const btnL = document.getElementById('toggleLeft');
    const sidebar = document.getElementById('sidebar');
    btnL.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      btnL.textContent = sidebar.classList.contains('open') ? '«' : '»';
      adjustMapWidth();
    });

    const btnR = document.getElementById('toggleRight');
    const infobar = document.getElementById('infobar');
    btnR.addEventListener('click', () => {
      infobar.classList.toggle('open');
      btnR.textContent = infobar.classList.contains('open') ? '»' : '«';
      adjustMapWidth();
    });
  });
</script>
