<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logan – Spelling Practice</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --card2: #0f1726;
      --text: #e8eefc;
      --muted: #aeb9d8;
      --accent: #67d5ff;
      --good: #63e6be;
      --bad: #ff6b6b;
      --warn: #ffd43b;
      --border: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 700px at 20% 0%, #121d35 0%, var(--bg) 55%);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(11,18,32,0.98), rgba(11,18,32,0.75));
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px; }
    .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; letter-spacing: 0.2px; }
    .pill {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,0.04);
    }
    main { padding: 18px 0 28px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .card .pad { padding: 16px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 880px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.20);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input[type="text"] { letter-spacing: 1px; }
    .btn {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }
    .btn:hover { background: rgba(255,255,255,0.10); }
    .btn.primary {
      background: rgba(103,213,255,0.18);
      border-color: rgba(103,213,255,0.35);
    }
    .btn.good { background: rgba(99,230,190,0.14); border-color: rgba(99,230,190,0.35); }
    .btn.bad { background: rgba(255,107,107,0.14); border-color: rgba(255,107,107,0.35); }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 9px 10px; border-radius: 12px; font-size: 14px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .stack { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .imgbox {
      background: rgba(255,255,255,0.92);
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      overflow: hidden;
      width: min(420px, 100%);
      margin: 0 auto;
    }
    .imgbox img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: contain;
    }
    .question-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      margin: 8px 0 0;
    }
    .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }
    .choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    @media (min-width: 640px) {
      .choices { grid-template-columns: 1fr 1fr; }
    }
    .toast {
      border-radius: 14px;
      padding: 12px 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      margin-top: 12px;
      text-align: center;
    }
    .toast.good { border-color: rgba(99,230,190,0.35); background: rgba(99,230,190,0.10); }
    .toast.bad { border-color: rgba(255,107,107,0.35); background: rgba(255,107,107,0.10); }

    .phonics-area {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .token-pool, .token-answer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
      min-height: 64px;
    }
    .token {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.6px;
      user-select: none;
      min-width: 44px;
      text-align: center;
    }
    .token.used { opacity: 0.35; cursor: not-allowed; }
    .answer-preview {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .blanks {
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 8px;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 700; }
    .thumb {
      width: 56px;
      height: 42px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.10);
    }
    .levelbar {
      display: inline-flex;
      gap: 4px;
      vertical-align: middle;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
    }
    .dot.on { background: rgba(103,213,255,0.55); border-color: rgba(103,213,255,0.55); }
    .right { text-align: right; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row">
        <h1>Logan – Spelling Practice</h1>
        <div id="topPills" class="stack"></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div id="app"></div>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
